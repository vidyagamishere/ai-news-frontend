<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 | Vidyagam</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 30% 20%, #111827, #030712 60%);
        color: #f9fafb;
      }
      .card {
        width: min(620px, calc(100% - 2rem));
        border: 1px solid #1f2937;
        border-radius: 16px;
        background: rgba(17, 24, 39, 0.75);
        padding: 2rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 2rem; }
      p { margin: 0.4rem 0; color: #d1d5db; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 1rem;
        color: #60a5fa;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404: Page Not Found</h1>
      <p>This URL does not map to a current Vidyagam article or category.</p>
      <p>Please check the link or return to the homepage.</p>
      <a href="/">Go to Home</a>
    </main>
  </body>
</html>
